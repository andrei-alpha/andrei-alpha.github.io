<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to zuriforge.ch...</title>
  
  <!-- Immediate Search Engine & Browser Redirect -->
  <meta http-equiv="refresh" content="0; url=https://zuriforge.ch/">
  <link rel="canonical" href="https://zuriforge.ch/">

  <script>
    // Immediately replace URL so the browser history doesn't trap the user with back-button loops
    var target = "https://zuriforge.ch/" + window.location.search + window.location.hash;
    window.location.replace(target);
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0c0d10;
      color: #f0ede6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: #14161b;
      border: 1px solid #262933;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }
    p {
      color: #9da3af;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    a.btn {
      display: inline-block;
      background: #d4a373;
      color: #0c0d10;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    a.btn:hover {
      background: #e0b488;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ZuriForge has moved</h1>
    <p>We have moved to our dedicated domain at <strong>zuriforge.ch</strong>. You are being redirected automatically.</p>
    <a href="https://zuriforge.ch/" class="btn" id="direct-link">Go to zuriforge.ch &rarr;</a>
  </div>

  <script>
    // Update manual button link to preserve query/hash as well
    document.getElementById('direct-link').href = target;
  </script>
</body>
</html>
