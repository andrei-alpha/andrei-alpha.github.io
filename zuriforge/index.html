<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZuriForge — Fine Woodworking &amp; Maker Journal</title>
  <meta name="description" content="A maker's woodworking journal from Zürich. Documenting bespoke woodwork, geometric end-grain lamination, and workshop techniques. Dedicated domain: zuriforge.ch">
  
  <link rel="canonical" href="https://zuriforge.ch/">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c0d10;
    }
    #zuriforge-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .fallback-message {
      display: none;
      color: #f0ede6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 4rem 1.5rem;
    }
    .fallback-message a {
      color: #d4a373;
      text-decoration: none;
      font-weight: 500;
    }
    .fallback-message a:hover {
      text-decoration: underline;
    }
  </style>

  <script>
    // Forward any query parameters or hash fragments to the framed site
    window.addEventListener('DOMContentLoaded', function() {
      var frame = document.getElementById('zuriforge-frame');
      if (frame && (window.location.search || window.location.hash)) {
        frame.src = 'https://zuriforge.ch/' + window.location.search + window.location.hash;
      }
    });
  </script>
</head>
<body>
  <iframe id="zuriforge-frame" src="https://zuriforge.ch" title="ZuriForge" allow="fullscreen" allowfullscreen>
    <div class="fallback-message" style="display: block;">
      <h2>ZuriForge has moved to its dedicated website</h2>
      <p style="margin-top: 1rem;">
        Please visit <a href="https://zuriforge.ch">zuriforge.ch</a> directly.
      </p>
    </div>
  </iframe>
</body>
</html>
